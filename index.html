<script>
  /* Thème appliqué avant l'affichage pour éviter un flash : choix mémorisé, sinon réglage du système. */
  (function () {
    var t = null;
    try {
        t = localStorage.getItem('contract-lab.theme');
    } catch (e) { /* stockage indisponible */ }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="libre">

<header id="topbar">
  <div class="brand"><span class="logo">📜</span><b>Contract Lab</b><small>atelier contrat de travail</small></div>
  <nav class="modes" role="tablist">
    <button data-mode="libre" class="active" title="Construire librement un contrat ou un dossier">✏️ Libre</button>
    <button data-mode="cinema" title="Dérouler un scénario commenté">🎬 Cinéma</button>
  </nav>
  <div class="actions" id="actions-libre">
    <button id="btn-new" title="Vider le canevas">🗋<span class="lbl"> Nouveau</span></button>
    <button id="btn-undo" title="Annuler (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Rétablir (Ctrl+Y)">↷</button>
    <button id="btn-layout" title="Réorganiser automatiquement">⇅<span class="lbl"> Disposer</span></button>
    <button id="btn-open" title="Ouvrir un schéma (.json) ou un scénario (.md)">📂<span class="lbl"> Ouvrir</span></button>
    <button id="btn-save" title="Enregistrer le schéma (.json)">💾<span class="lbl"> Enregistrer</span></button>
    <button id="btn-share-libre" title="Copier un lien vers ce schéma (pour les élèves, un collègue)">🔗<span class="lbl"> Partager</span></button>
    <button id="btn-studio" title="Capturer des étapes et produire un scénario">📸<span class="lbl"> Studio</span></button>
  </div>
  <div class="actions" id="actions-cinema" hidden>
    <button id="btn-library" title="Choisir un scénario">📚<span class="lbl"> Scénarios</span></button>
    <button id="btn-share" title="Copier un lien vers ce scénario ou cette étape">🔗<span class="lbl"> Partager</span></button>
    <button id="btn-scorm" title="Exporter ce scénario en paquet SCORM (Moodle, LMS)">📦<span class="lbl"> SCORM</span></button>
    <button id="btn-edit-md" title="Voir et modifier le markdown du scénario">📝<span class="lbl"> Markdown</span></button>
    <button id="btn-to-libre" title="Reprendre l'état affiché en mode libre">✏️<span class="lbl"> Explorer librement</span></button>
  </div>
  <div class="actions right">
    <select id="opt-droit" class="hsel" aria-label="Droit applicable"></select>
    <select id="opt-lang" class="hsel" aria-label="Langue de l'interface" title="Langue de l'interface"></select>
    <label class="opt" title="Affiche les verdicts (valide, à risque, nulle) et les pastilles de garde-fous. Décochez pour laisser la classe juger."><input type="checkbox" id="opt-verif" checked> 🔍 Vérification</label>
    <button id="btn-theme" class="theme-btn" title="Mode jour / nuit">🌙</button>
    <button id="btn-help" title="Aide">❔<span class="lbl"> Aide</span></button>
  </div>
</header>

<main id="main">
  <aside id="palette"></aside>

  <section id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="banner" hidden></div>
    <div id="zoom">
      <button data-z="in" title="Zoom avant">+</button>
      <button data-z="out" title="Zoom arrière">−</button>
      <button data-z="fit" title="Tout afficher (F)">⤢</button>
    </div>
    <div id="legend"></div>
    <div id="studio" hidden></div>
    <div id="qsheet" hidden aria-live="polite"></div>
    <div id="toast"></div>
  </section>

  <aside id="side">
    <div id="inspector"></div>
    <div id="commentary" hidden></div>
  </aside>
</main>

<footer id="player" hidden>
  <button id="pl-first" title="Début (Origine)">⏮</button>
  <button id="pl-prev" title="Étape précédente (←)">◀</button>
  <button id="pl-play" class="primary" title="Lecture / pause (Espace)">▶ Lecture</button>
  <button id="pl-next" class="primary" title="Étape suivante (→)">Suivant ▶</button>
  <button id="pl-reset" title="Remettre les cartes et les bulles déplacées à leur place d'origine" hidden>↺ Disposition</button>
  <div id="pl-progress"><div id="pl-dots"></div><div id="pl-timer"><i></i></div></div>
  <span id="pl-count">–</span>
  <div id="pl-view" role="group" aria-label="Affichage">
    <button data-v="schema" title="Schéma seul">🗺</button>
    <button data-v="split" title="Schéma et explications">◫</button>
    <button data-v="texte" title="Explications seules">📖</button>
  </div>
  <label class="pl-modelabel">Mode
    <select id="pl-mode">
      <option value="pas">Pas à pas</option>
      <option value="continu">Lecture continue</option>
    </select>
  </label>
  <label class="speed">Rythme <input type="range" id="pl-speed" min="0.25" max="3" step="0.25" value="1"> <span id="pl-speed-v">1×</span></label>
</footer>

<div id="modal" hidden><div class="dialog"><button class="close" title="Fermer (Échap)">×</button><div class="content"></div></div></div>
<input type="file" id="file-input" accept=".md,.markdown,.txt,.json" hidden>

<script src="js/i18n.js"></script>
<script src="js/i18n-en.js"></script>
<script src="js/i18n-es.js"></script>
<script src="js/model.js"></script>
<script src="js/catalog-fr-en.js"></script>
<script src="js/catalog-uk.js"></script>
<script src="js/catalog-es.js"></script>
<script src="js/scenario.js"></script>
<script src="js/docs.js"></script>
<script src="js/library.js"></script>
<script src="js/library-en.js"></script>
<script src="js/library-uk.js"></script>
<script src="js/library-es.js"></script>
<script src="js/scorm.js"></script>
<script src="js/app.js"></script>
<script src="js/intro-launcher.js"></script>
</body>
</html>
